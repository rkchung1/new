[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc5m-agents"
version = "0.1.0"
description = "Reproducible backtesting for Polymarket BTC 5-minute markets with LangGraph agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "rich>=13.0",
    "typer>=0.12",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
